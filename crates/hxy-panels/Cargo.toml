[package]
name = "hxy-panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Framework-agnostic panel logic for hxy: goto/range parsing, search engine, inspector decoders, strings/entropy/checksums, and compare-view diffing"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
hxy-core = { workspace = true }
hxy-calculator = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Checksum tool: each crate exposes the same RustCrypto `Digest` API
# so the streaming-pass implementation can fan out to every selected
# algorithm uniformly. CRC32 sits outside the RustCrypto trait family
# but `crc32fast::Hasher` follows the same `update` + `finalize`
# shape so the dispatcher pays no overhead.
adler2 = "2"
blake3 = "1.8"
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.11.0"

# Byte diff (compare view): Myers via `similar`; `web-time` backs
# the debounce clock so it also builds on wasm32-unknown-unknown.
similar = { version = "3.1.0", default-features = false, features = ["bytes", "std"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# File watcher (watch.rs): kernel-level fs events + a polling
# fallback. Not available on wasm32, mirroring crates/hxy's own
# target-gated dependency block for the same crates.
notify = "8"
notify-debouncer-full = "0.5"

[dev-dependencies]
tempfile = "3"
