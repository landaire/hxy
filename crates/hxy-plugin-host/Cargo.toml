[package]
name = "hxy-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wasmtime-based host for hxy plugins (byte source, VFS handler, template runtime)."

[dependencies]
hxy-core = { workspace = true }
hxy-vfs = { workspace = true }
base64 = { workspace = true }
getrandom = "0.4.3"
serde = { workspace = true }
sha2 = "0.11.0"
thiserror = { workspace = true }
toml = "1.1.4"
tracing = { workspace = true }
vfs = { workspace = true }
# default-features disabled to drop debug-builtins / wasmtime-jit-debug /
# profiling: those pull GDB-JIT-debug and VTune C helpers whose build-script
# static libs Buck doesn't propagate to the final link. hxy doesn't use them.
wasmtime = { version = "44", default-features = false, features = [
    "addr2line",
    "async",
    "cache",
    "component-model",
    "component-model-async",
    "cranelift",
    "coredump",
    "debug",
    "demangle",
    "gc",
    "gc-drc",
    "gc-null",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "stack-switching",
    "std",
    "threads",
    "wasmtime-jit-icache-coherence",
    "wat",
] }
wasmtime-wasi = "44"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
