[package]
name = "hxy-templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Desktop-only template subsystem shared by the hxy frontends: builtin 010/ImHex runtimes, template library and include sandbox, and pure run helpers"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
hxy-core = { workspace = true }
hxy-i18n = { workspace = true }
hxy-vfs = { workspace = true }
hxy-plugin-host = { workspace = true }

# Built-in 010 Editor Binary Template + ImHex pattern-language
# runtimes -- both linked as regular Rust instead of being wrapped
# in a WASM component.
hxy-010-lang = { workspace = true }
hxy-imhex-lang = { workspace = true }

# Locates the per-user imhex-patterns data dir for import resolution.
dirs = "6"

# Template-source fingerprints (run/restart match) and visualizer
# content fingerprints.
blake3 = "1.8"

# `image` visualizer decode: sniffs + decodes PNG/JPEG/GIF/BMP/TIFF/
# WebP bytes into RGBA buffers. Version matches crates/hxy so the
# graph stays deduplicated.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

# ImHex-Patterns corpus download: blocking reqwest run on a worker
# thread by the hosts; zip + sha2 unpack and fingerprint the corpus.
# Versions match crates/hxy so the graph stays deduplicated.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
