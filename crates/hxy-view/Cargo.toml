[package]
name = "hxy-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reusable egui hex-view widget"

[dependencies]
egui = { workspace = true }
egui_minimap = { workspace = true }
hxy-core = { workspace = true }
hxy-editor = { workspace = true, default-features = false }
serde = { workspace = true, optional = true }

[features]
default = ["editor"]
# Enables the full HexEditor editing surface (patch overlay, undo/redo,
# hex/ASCII keystroke input, cursor navigation) via hxy-editor.
# Disabling leaves the lightweight renderer + selection/hover
# interaction only -- useful for strict read-only viewers.
editor = ["hxy-editor/editor"]
# Implements Serialize/Deserialize on the persistent editor types so
# consumers can round-trip undo history through their own storage
# layer. Requires `editor`.
serde = ["dep:serde", "editor", "hxy-editor/serde"]
# Pull in `dhat` + `egui_kittest` so the `hexview_dhat` profiling
# example can swap in dhat::Alloc as the global allocator and drop a
# heap profile after a synthetic frame loop. Off by default; enable
# with `cargo run -p hxy-view --example hexview_dhat --features
# dhat-bench --release`. Lives as `[[example]]` rather than `[[bin]]`
# so it doesn't compete with the hxy binary for `cargo run`'s
# default-package selection.
dhat-bench = ["dep:dhat", "dep:egui_kittest"]

[dev-dependencies]
egui_kittest = "0.36.1"

[dependencies.dhat]
version = "0.3.3"
optional = true

[dependencies.egui_kittest]
version = "0.36.1"
optional = true

[[example]]
name = "hexview_dhat"
path = "bin/hexview_dhat.rs"
required-features = ["editor", "dhat-bench"]
