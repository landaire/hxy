[package]
name = "hxy-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Framework-neutral single-instance IPC socket protocol and CLI parsing for hxy"

[lints.rust]
# `deny` rather than `forbid` so the macos-only `macos_open` module can
# opt back in with `#![allow(unsafe_code)]` for its objc2 FFI; the rest
# of the crate stays unsafe-free.
unsafe_code = "deny"

[dependencies]
tracing = { workspace = true }

# Single-instance forwarding: one GenericNamespaced socket name maps
# to an abstract socket on Linux, a /tmp file on macOS, and a named
# pipe on Windows. Desktop-only; this crate is not part of the wasm
# graph (crates/hxy gates its dependency behind not(wasm32)).
interprocess = "2.4.3"

# Typed, length-prefixed wire format for the forwarded-open payload.
rkyv = { version = "0.8.18", default-features = false, features = ["alloc", "bytecheck"] }

# CLI: positional file paths only.
clap = { version = "4.6.6", features = ["derive"] }

# macOS Finder "Open With" / right-click "Open in hxy": the objc2 FFI
# for the Apple Event + NSServices handlers in `macos_open`. macos-only;
# the crate builds without these on Linux/Windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSObject",
    "NSString",
    "NSURL",
    "objc2-core-services",
] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard"] }
