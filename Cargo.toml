[workspace]
resolver = "3"
members = [
    "crates/hxy-core",
    "crates/hxy-i18n",
    "crates/hxy-editor",
    "crates/hxy-view",
    "crates/hxy-vfs",
    "crates/hxy",
    "crates/hxy-plugin-host",
    "crates/hxy-plugin-api",
    "crates/hxy-010-lang",
    "crates/hxy-imhex-lang",
    "crates/hxy-calculator",
    "crates/hxy-panels",
    "crates/hxy-settings",
    "crates/hxy-templates",
    "crates/hxy-ipc",
    "crates/egui-palette",
    "crates/palette-core",
    "crates/egui_minimap",
    "crates/egui_dock_picker",
    # The gpui client and its widgets are members of this one workspace
    # (buck2-first; a single Cargo graph for the whole repo). gpui is the
    # crates.io `gpui-pre` family, so it resolves alongside the egui/eframe
    # stack without the git-pin unification that once forced a split.
    "gpui/hxy-gpui",
    "gpui/hxy-view-gpui",
    "gpui/gpui_dock_picker",
    # Plugin components (crate-type cdylib, built for wasm32-wasip2 by
    # buck2 under //platforms:wasm32-wasip2). They are workspace members
    # so reindeer generates their buck targets and they share one lock,
    # but they are kept out of `default-members`: a wasm-only cdylib does
    # not link for the host, so a bare `cargo build`/`cargo test` must not
    # try to build them.
    "plugins/bt-runtime",
    "plugins/fixture-template",
    "plugins/passthrough",
    "plugins/png-template",
    "plugins/test-statecmd",
    "plugins/udmp",
    "plugins/xbox-neighborhood",
]
# `cargo build`/`cargo test` with no `-p` operate on these; the wasm-only
# plugin members above are deliberately omitted (build them for wasm via
# buck2, or `cargo build -p <plugin> --target wasm32-wasip2`).
default-members = [
    "crates/hxy-core",
    "crates/hxy-i18n",
    "crates/hxy-editor",
    "crates/hxy-view",
    "crates/hxy-vfs",
    "crates/hxy",
    "crates/hxy-plugin-host",
    "crates/hxy-plugin-api",
    "crates/hxy-010-lang",
    "crates/hxy-imhex-lang",
    "crates/hxy-calculator",
    "crates/hxy-panels",
    "crates/hxy-settings",
    "crates/hxy-templates",
    "crates/hxy-ipc",
    "crates/egui-palette",
    "crates/palette-core",
    "crates/egui_minimap",
    "crates/egui_dock_picker",
    "gpui/hxy-gpui",
    "gpui/hxy-view-gpui",
    "gpui/gpui_dock_picker",
]
# Vendored [patch.crates-io] sources are standalone packages, not
# workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Lander Brandt"]
repository = "https://github.com/landaire/hxy"

[workspace.dependencies]
# Internal crates -- versioned in lockstep with the workspace.
hxy-core = { path = "crates/hxy-core", version = "0.5.0" }
hxy-i18n = { path = "crates/hxy-i18n", version = "0.5.0" }
hxy-editor = { path = "crates/hxy-editor", version = "0.5.0", default-features = false }
hxy-view = { path = "crates/hxy-view", version = "0.5.0" }
hxy-vfs = { path = "crates/hxy-vfs", version = "0.5.0" }
hxy-plugin-host = { path = "crates/hxy-plugin-host", version = "0.5.0" }
hxy-010-lang = { path = "crates/hxy-010-lang", version = "0.5.0" }
hxy-imhex-lang = { path = "crates/hxy-imhex-lang", version = "0.5.0" }
hxy-calculator = { path = "crates/hxy-calculator", version = "0.5.0" }
hxy-panels = { path = "crates/hxy-panels", version = "0.5.0" }
hxy-settings = { path = "crates/hxy-settings", version = "0.5.0" }
hxy-templates = { path = "crates/hxy-templates", version = "0.5.0" }
hxy-ipc = { path = "crates/hxy-ipc", version = "0.5.0" }
egui-palette = { path = "crates/egui-palette", version = "0.7.0" }
palette-core = { path = "crates/palette-core", version = "0.5.0" }
egui_minimap = { path = "crates/egui_minimap", version = "0.5.0" }
egui_dock_picker = { path = "crates/egui_dock_picker", version = "0.5.0" }

# The gpui client's crates (app + widgets), members of this workspace.
gpui_dock_picker = { path = "gpui/gpui_dock_picker", version = "0.5.0" }
hxy-view-gpui = { path = "gpui/hxy-view-gpui", version = "0.5.0" }
# `gpui` is the gpui-kit umbrella from the pushed fork (aliased so `gpui::*`
# is GPUI, `gpui::component` the dock/widgets, `gpui::platform` the platform
# layer). Tracks the `buck-crate-path-fix` branch (the dock work plus the
# IntoPlot buck fix) -- gpui-kit is not on crates.io -- so local fork edits
# must be pushed before the app sees them.
# GPUI itself is the crates.io `gpui-pre` family pulled in by gpui-kit.
gpui = { package = "gpui-kit", git = "https://github.com/landaire-contrib/gpui-component", branch = "buck-crate-path-fix" }

# Shared third-party deps. Pinning here keeps every member crate on
# the same version and feature baseline; per-crate Cargo.tomls add
# extra features on top via `features = [...]` next to
# `workspace = true`.
egui = "0.36.1"
fskit = { version = "0.2", features = ["vfs"] }
jiff = { version = "0.2.35", features = ["serde"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
suture = "0.3.0"
thiserror = "2.0.19"
tracing = "0.1.44"
vfs = "0.13.0"
winnow = "1.0"
base64 = "0.23.1"
insta = { version = "1.48.0", features = ["yaml"] }

# Temporary bridges for the egui 0.36 upgrade: neither crate has an
# upstream release supporting egui 0.36 yet. Both block publishing the
# hxy app crate (patched versions do not exist on crates.io); the
# egui-* widget crates are unaffected. Drop each entry the moment
# upstream publishes for 0.36.
[patch.crates-io]
# Nix materializes these patch overlays for Cargo and Reindeer.
egui-phosphor = { path = "third-party/overrides/egui-phosphor" }
egui_ltreeview = { path = "third-party/overrides/egui_ltreeview" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
