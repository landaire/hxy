[workspace]
resolver = "3"
members = [
    "crates/hxy-core",
    "crates/hxy-i18n",
    "crates/hxy-view",
    "crates/hxy-vfs",
    "crates/hxy",
    "crates/hxy-plugin-host",
    "crates/hxy-plugin-api",
    "crates/hxy-010-lang",
    "crates/hxy-imhex-lang",
    "crates/hxy-calculator",
    "crates/egui-palette",
    "crates/egui_minimap",
    "crates/egui_dock_picker",
]
# Vendored [patch.crates-io] sources are standalone packages, not
# workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Lander Brandt"]
repository = "https://github.com/landaire/hxy"

[workspace.dependencies]
# Internal crates -- versioned in lockstep with the workspace.
hxy-core = { path = "crates/hxy-core", version = "0.5.0" }
hxy-i18n = { path = "crates/hxy-i18n", version = "0.5.0" }
hxy-view = { path = "crates/hxy-view", version = "0.5.0" }
hxy-vfs = { path = "crates/hxy-vfs", version = "0.5.0" }
hxy-plugin-host = { path = "crates/hxy-plugin-host", version = "0.5.0" }
hxy-010-lang = { path = "crates/hxy-010-lang", version = "0.5.0" }
hxy-imhex-lang = { path = "crates/hxy-imhex-lang", version = "0.5.0" }
hxy-calculator = { path = "crates/hxy-calculator", version = "0.5.0" }
egui-palette = { path = "crates/egui-palette", version = "0.7.0" }
egui_minimap = { path = "crates/egui_minimap", version = "0.5.0" }
egui_dock_picker = { path = "crates/egui_dock_picker", version = "0.5.0" }

# Shared third-party deps. Pinning here keeps every member crate on
# the same version and feature baseline; per-crate Cargo.tomls add
# extra features on top via `features = [...]` next to
# `workspace = true`.
egui = "0.36.1"
fskit = { version = "0.2", features = ["vfs"] }
jiff = { version = "0.2.35", features = ["serde"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
suture = "0.3.0"
thiserror = "2.0.19"
tracing = "0.1.44"
vfs = "0.13.0"
winnow = "1.0"
base64 = "0.23.1"
insta = { version = "1.48.0", features = ["yaml"] }

# Temporary bridges for the egui 0.36 upgrade: neither crate has an
# upstream release supporting egui 0.36 yet. Both block publishing the
# hxy app crate (patched versions do not exist on crates.io); the
# egui-* widget crates are unaffected. Drop each entry the moment
# upstream publishes for 0.36.
[patch.crates-io]
# Nix materializes these patch overlays for Cargo and Reindeer.
egui-phosphor = { path = "third-party/overrides/egui-phosphor" }
egui_ltreeview = { path = "third-party/overrides/egui_ltreeview" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
