buildscript.run = false

[env]
OUT_DIR = "$(location //fixups/libsqlite3-sys:out_dir)"

[[cxx_library]]
name = "sqlite3"
srcs = ["sqlite3/sqlite3.c"]
headers = ["sqlite3/*.h"]
# UNLOCK_NOTIFY matches libsqlite3-sys's `unlock_notify` feature; without
# it sqlx-sqlite's sqlite3_unlock_notify reference is an undefined symbol.
preprocessor_flags = [
    "-DSQLITE_ENABLE_COLUMN_METADATA",
    "-DSQLITE_ENABLE_FTS3",
    "-DSQLITE_ENABLE_RTREE",
    "-DSQLITE_ENABLE_UNLOCK_NOTIFY",
]
