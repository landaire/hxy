name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-flight deploy if a fresh push lands -- we always
# want the latest main on Pages, not whatever finished racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/determinate-nix-action@441b9e401ac050c38a07d8313748c5c2d17e8aff # v3.6.1

      # `--public-url /hxy/` matches the path the Pages site is
      # served from (`https://<user>.github.io/hxy/`). Trunk
      # injects it into the `<base data-trunk-public-url />` tag
      # so all asset URLs resolve under the sub-path.
      - name: Build with Trunk
        run: nix develop --command sh -c 'cd crates/hxy && trunk build --release --public-url /hxy/'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/hxy/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
