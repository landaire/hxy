manifest_path = "Cargo.toml"
third_party_dir = "."
include_workspace_members = true
precise_srcs = true
cargo_env = true
vendor = false

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
target_abi = [""]
target_arch = ["x86_64"]
target_endian = ["little"]
target_env = ["gnu"]
target_family = ["unix"]
target_feature = ["fxsr", "sse", "sse2"]
target_has_atomic = ["16", "32", "64", "8", "ptr"]
target_os = ["linux"]
target_pointer_width = ["64"]
target_vendor = ["unknown"]

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
target_abi = [""]
target_arch = ["aarch64"]
target_endian = ["little"]
target_env = ["gnu"]
target_family = ["unix"]
target_feature = ["neon"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]
target_os = ["linux"]
target_pointer_width = ["64"]
target_vendor = ["unknown"]

[platform.macos-x86_64]
target = "x86_64-apple-darwin"
target_abi = [""]
target_arch = ["x86_64"]
target_endian = ["little"]
target_env = [""]
target_family = ["unix"]
target_feature = ["cmpxchg16b", "fxsr", "sse", "sse2", "sse3", "sse4.1", "ssse3"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]
target_os = ["macos"]
target_pointer_width = ["64"]
target_vendor = ["apple"]

[platform.macos-arm64]
target = "aarch64-apple-darwin"
target_abi = [""]
target_arch = ["aarch64"]
target_endian = ["little"]
target_env = [""]
target_family = ["unix"]
target_feature = ["aes", "crc", "dit", "dotprod", "dpb", "dpb2", "fcma", "fhm", "flagm", "fp16", "frintts", "jsconv", "lor", "lse", "neon", "paca", "pacg", "pan", "pmuv3", "ras", "rcpc", "rcpc2", "rdm", "sb", "sha2", "sha3", "ssbs", "vh"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]
target_os = ["macos"]
target_pointer_width = ["64"]
target_vendor = ["apple"]

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"
target_abi = [""]
target_arch = ["x86_64"]
target_endian = ["little"]
target_env = ["msvc"]
target_family = ["windows"]
target_feature = ["cmpxchg16b", "fxsr", "sse", "sse2", "sse3"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]
target_os = ["windows"]
target_pointer_width = ["64"]
target_vendor = ["pc"]

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"
target_abi = [""]
target_arch = ["x86_64"]
target_endian = ["little"]
target_env = ["gnu"]
target_family = ["windows"]
target_feature = ["cmpxchg16b", "fxsr", "sse", "sse2", "sse3"]
target_has_atomic = ["128", "16", "32", "64", "8", "ptr"]
target_os = ["windows"]
target_pointer_width = ["64"]
target_vendor = ["pc"]

[buck]
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")

hxy_packages = {
    "debug": "hxy-debug",
    "release": "hxy",
}
hxy_profile = read_config("hxy", "profile", "debug")
hxy_package = hxy_packages.get(hxy_profile, "hxy-invalid-profile")

genrule(
    name = "hxy-nix",
    out = "hxy",
    executable = True,
    srcs = glob([
        "BUCK",
        "Cargo.lock",
        "Cargo.toml",
        "assets/**",
        "crates/**",
        "flake.lock",
        "flake.nix",
        "img/**",
        "nix/**",
        "reindeer.toml",
        "rust-toolchain.toml",
        "translations/**",
        "vendor/**",
        "wit/**",
    ]),
    cmd = '''
        set -eu
        workdir="`mktemp -d "${TMPDIR:-/tmp}/hxy-nix.XXXXXX"`"
        trap 'rm -rf "$workdir"' EXIT
        source_dir="$workdir/source"
        for source in $SRCS; do
            destination="$source_dir/${source#././}"
            mkdir -p "${destination%%/*}"
            if [ -d "$source" ]; then
                cp -R -L "$source" "$destination"
            else
                cp -L "$source" "$destination"
            fi
        done
        nix build --no-write-lock-file --out-link "$workdir/result" "path:$source_dir#%s"
        cp "$workdir/result/bin/hxy" "$OUT"
    ''' % hxy_package,
)

# The canonical build: hxy compiled by Buck's own Rust rules from the Reindeer
# graph. Requires the Nix dev shell for the toolchain. `//:hxy-nix` above is the
# reproducible Nix package (a genrule wrapping `nix build`), kept as a fallback.
#
# `//:hxy` is the gpui client (the main app); `//:hxy-egui` is the egui client,
# kept buildable until the hard cutover.
alias(
    name = "hxy",
    actual = ":hxy-gpui-0.5-hxy",
    visibility = ["PUBLIC"],
)

alias(
    name = "hxy-native",
    actual = ":hxy-gpui-0.5-hxy",
    visibility = ["PUBLIC"],
)

alias(
    name = "hxy-egui",
    actual = ":hxy-0.5-hxy-egui",
    visibility = ["PUBLIC"],
)

# Wasm plugin components. The plugin crates are workspace members, so
# reindeer emits their rust_library targets below; for each, a
# configured_alias pins it to the wasm target platform (its cdylib links
# into a wasip2 component via wasm-component-ld) and a genrule copies it
# out under its deployable name. Build one with
# `buck2 build //:<name>-plugin`; the output is the .wasm to deploy.
# (name, reindeer crate target, output wasm stem)
_wasm_plugins = [
    ("xbox-neighborhood", "hxy-xbox-neighborhood-0.1", "hxy_xbox_neighborhood"),
    ("passthrough", "hxy-plugin-passthrough-0.1", "hxy_plugin_passthrough"),
    ("udmp", "hxy-udmp-plugin-0.1", "hxy_udmp_plugin"),
    ("bt-runtime", "hxy-bt-runtime-0.1", "hxy_bt_runtime"),
    ("png-template", "hxy-png-template-0.1", "hxy_png_template"),
    ("test-statecmd", "hxy-plugin-test-statecmd-0.1", "hxy_plugin_test_statecmd"),
    ("fixture-template", "hxy-fixture-template-runtime-0.1", "hxy_fixture_template_runtime"),
]
# List comprehensions (not a `for` statement, which the BUCK dialect
# forbids at top level) register the two targets per plugin.
[
    configured_alias(
        name = _p[0] + "-component",
        actual = ":" + _p[1] + "[shared]",
        platform = "//platforms:wasm32-wasip2",
        visibility = ["PUBLIC"],
    )
    for _p in _wasm_plugins
]
[
    genrule(
        name = _p[0] + "-plugin",
        out = _p[2] + ".wasm",
        cmd = "cp $(location :" + _p[0] + "-component) $OUT",
        visibility = ["PUBLIC"],
    )
    for _p in _wasm_plugins
]

# Dev bundle: the app binary with the deployable plugin components laid
# out beside it -- hxy:vfs handlers in `plugins/`, template runtimes in
# `template-plugins/` -- plus their sidecar manifests. A debug build
# scans those executable-adjacent dirs, so the bundled binary discovers
# every plugin with no install step. `//:hxy-dev` below runs it;
# `//:hxy-dev-bundle` is the assembled directory. Test-only fixtures
# (test-statecmd, fixture-template) build via their `*-plugin` targets
# but are not bundled.
genrule(
    name = "hxy-dev-bundle",
    out = "hxy-dev",
    srcs = [
        "plugins/xbox-neighborhood/hxy_xbox_neighborhood.hxy.toml",
        "plugins/udmp/hxy_udmp_plugin.hxy.toml",
    ],
    cmd = '''
        mkdir -p "$OUT/plugins" "$OUT/template-plugins"
        cp "$(location :hxy)" "$OUT/hxy"
        cp "$(location :xbox-neighborhood-plugin)" "$OUT/plugins/hxy_xbox_neighborhood.wasm"
        cp "$(location :passthrough-plugin)" "$OUT/plugins/hxy_plugin_passthrough.wasm"
        cp "$(location :udmp-plugin)" "$OUT/plugins/hxy_udmp_plugin.wasm"
        cp "$(location :bt-runtime-plugin)" "$OUT/template-plugins/hxy_bt_runtime.wasm"
        cp "$(location :png-template-plugin)" "$OUT/template-plugins/hxy_png_template.wasm"
        for s in $SRCS; do cp "$s" "$OUT/plugins/"; done
    ''',
    visibility = ["PUBLIC"],
)

# `buck2 run //:hxy-dev` builds the bundle and launches the binary from
# inside it, so current_exe() sits beside the plugin dirs.
sh_binary(
    name = "hxy-dev-launcher",
    main = "scripts/run-bundle.sh",
    visibility = ["PUBLIC"],
)

command_alias(
    name = "hxy-dev",
    exe = ":hxy-dev-launcher",
    args = ["$(location :hxy-dev-bundle)"],
    visibility = ["PUBLIC"],
)
"""
