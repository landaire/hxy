[workspace]
resolver = "3"
members = ["gpui_dock_picker", "hxy-gpui", "hxy-view-gpui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Lander Brandt"]
repository = "https://github.com/landaire/hxy"

# gpui-component points at the local fork (`~/src/gpui-component`), whose
# 0.5.2 dock rewrite (pure-data `PaneTree`/`DockLayout`, nestable side
# docks, per-tab close) is what the app now targets. The fork is not on
# crates.io, so this is a path dep during fork development; swap to the
# pushed git fork once it lands upstream. A relative path keeps the
# reference off any one machine's absolute layout (assumes the fork sits
# at `~/src/gpui-component` alongside `~/dev/hxy`).
#
# The fork's `gpui-component` resolves `gpui` from zed git (it depends on
# git-only zed crates like `gpui_platform`/`gpui_macros` that never ship
# to crates.io), so the app must resolve the SAME git `gpui` or the two
# `gpui` instances are distinct crates and won't interoperate. Hence the
# git rev below matches the fork's `Cargo.lock`.
# `runtime_shaders`: gpui's default macOS build ahead-of-time-compiles its
# Metal shaders via `xcrun metal`, which ships with full Xcode.app, not
# Xcode Command Line Tools (all that's installed here). This feature makes
# gpui stitch/compile shaders at runtime instead, so the build doesn't need
# the `metal` binary at all. At this zed rev the feature lives on
# `gpui_platform` (not `gpui`), so it is enabled via a direct
# `gpui_platform` dep that hxy-gpui pulls in; Cargo feature unification
# then turns it on for the single `gpui_platform` the whole graph shares.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", features = ["runtime_shaders"] }
gpui-component = { path = "../../../src/gpui-component/crates/ui" }
gpui_dock_picker = { path = "gpui_dock_picker", version = "0.3.0" }
hxy-calculator = { path = "../crates/hxy-calculator", version = "0.5.0" }
hxy-core = { path = "../crates/hxy-core", version = "0.5.0" }
hxy-editor = { path = "../crates/hxy-editor", version = "0.5.0" }
hxy-i18n = { path = "../crates/hxy-i18n", version = "0.5.0" }
hxy-ipc = { path = "../crates/hxy-ipc", version = "0.5.0" }
hxy-panels = { path = "../crates/hxy-panels", version = "0.5.0" }
hxy-plugin-host = { path = "../crates/hxy-plugin-host", version = "0.5.0" }
hxy-settings = { path = "../crates/hxy-settings", version = "0.5.0" }
hxy-templates = { path = "../crates/hxy-templates", version = "0.5.0" }
hxy-vfs = { path = "../crates/hxy-vfs", version = "0.5.0" }
hxy-view-gpui = { path = "hxy-view-gpui", version = "0.3.0" }
jiff = "0.2.24"
palette-core = { path = "../crates/palette-core", version = "0.5.0" }
tracing = "0.1.44"

[profile.dev.package."*"]
opt-level = 2
