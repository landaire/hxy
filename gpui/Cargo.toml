[workspace]
resolver = "3"
members = ["gpui_dock_picker", "hxy-gpui", "hxy-view-gpui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Lander Brandt"]
repository = "https://github.com/landaire/hxy"

# The app targets the pushed fork's dock rewrite (pure-data
# `PaneTree`/`DockLayout`, nestable side docks, per-tab close, render_tab hook),
# now shipped through the `gpui-kit` umbrella crate
# (github.com/landaire-contrib/gpui-component, `crates/kit`).
# `gpui = { package = "gpui-kit" }` aliases the umbrella to the `gpui` name, so
# `gpui::*` is GPUI, `gpui::component` is the dock/widgets, and `gpui::platform`
# is the platform layer -- one dependency in place of the old gpui +
# gpui_platform + gpui-component trio.
#
# GPUI itself is now the crates.io `gpui-pre` family (pulled in by gpui-kit),
# so there are no more zed git deps to pin or unify. `runtime_shaders` (compile
# Metal shaders at runtime, so the build needs no `xcrun metal` from a full
# Xcode) rides in via gpui-kit's `gpui_platform` dep. A git dep pinned to the
# `upstream-dock` tip so the nix package and buck2 can build the gpui client
# (a local path is invisible to the sandboxed/vendored build); the cost is
# that local fork edits must be pushed before the app sees them.
[workspace.dependencies]
gpui = { package = "gpui-kit", git = "https://github.com/landaire-contrib/gpui-component", rev = "753f1545d9b57a2ed9f78df50c984a9f3da7e726" }
gpui_dock_picker = { path = "gpui_dock_picker", version = "0.3.0" }
hxy-calculator = { path = "../crates/hxy-calculator", version = "0.5.0" }
hxy-core = { path = "../crates/hxy-core", version = "0.5.0" }
hxy-editor = { path = "../crates/hxy-editor", version = "0.5.0" }
hxy-i18n = { path = "../crates/hxy-i18n", version = "0.5.0" }
hxy-ipc = { path = "../crates/hxy-ipc", version = "0.5.0" }
hxy-panels = { path = "../crates/hxy-panels", version = "0.5.0" }
hxy-plugin-host = { path = "../crates/hxy-plugin-host", version = "0.5.0" }
hxy-settings = { path = "../crates/hxy-settings", version = "0.5.0" }
hxy-templates = { path = "../crates/hxy-templates", version = "0.5.0" }
hxy-vfs = { path = "../crates/hxy-vfs", version = "0.5.0" }
hxy-view-gpui = { path = "hxy-view-gpui", version = "0.3.0" }
jiff = "0.2.24"
palette-core = { path = "../crates/palette-core", version = "0.5.0" }
tracing = "0.1.44"

[profile.dev.package."*"]
opt-level = 2
