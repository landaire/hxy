[package]
name = "hxy-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI port of the hxy hex editor"
publish = false

[features]
# Nested-dock (workspace-in-a-tab) feasibility spike -- Task 8 of the M2
# plan. See gpui/hxy-gpui/src/panels/workspace_spike.rs and
# docs/superpowers/plans/2026-07-25-m2-nested-dock-verdict.md. Out of the
# default build: throwaway investigation, not product code.
dock-spike = []

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_dock_picker = { workspace = true }
hxy-calculator = { workspace = true }
hxy-core = { workspace = true }
hxy-editor = { workspace = true, features = ["editor"] }
hxy-i18n = { workspace = true }
hxy-panels = { workspace = true }
hxy-view-gpui = { workspace = true }
jiff = { workspace = true }
palette-core = { workspace = true }
serde_json = "1"
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile = "3"
