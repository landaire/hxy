[package]
name = "hxy-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI port of the hxy hex editor"
publish = false

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_dock_picker = { workspace = true }
hxy-calculator = { workspace = true }
hxy-core = { workspace = true }
hxy-editor = { workspace = true, features = ["editor"] }
hxy-i18n = { workspace = true }
hxy-panels = { workspace = true }
hxy-plugin-host = { workspace = true }
hxy-settings = { workspace = true }
hxy-templates = { workspace = true }
hxy-vfs = { workspace = true }
hxy-view-gpui = { workspace = true }
# Only for `image::{Frame, RgbaImage}` in `gpui::RenderImage::new`'s
# signature (gpui does not re-export them); version range matches
# gpui 0.2.2's own `image = "0.25.1"` so the types unify.
image = { version = "0.25", default-features = false }
jiff = { workspace = true }
palette-core = { workspace = true }
# Embeds assets/icons; already in the dep tree via gpui_util, so this
# adds no new transitive deps.
rust-embed = "8"
serde_json = "1"
thiserror = "2"
# Builds the runtime handed to hxy-settings' `SaveSink`, which blocks
# on it for its SQLite writes.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }

# Template panel "Save bytes to file..." dialog; matches the egui
# app's rfd version.
rfd = "0.17.2"

# Referenced for its `notify::Result` alias (`hxy_panels::watch::FileWatcher`'s
# constructors return it); pinned to the same version hxy-panels uses.
notify = "8"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile = "3"
zip = { version = "8.5.1", default-features = false }
