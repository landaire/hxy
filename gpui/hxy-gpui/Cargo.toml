[package]
name = "hxy-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI port of the hxy hex editor"
publish = false

[dependencies]
gpui = { workspace = true }
# Pulled solely to enable its `runtime_shaders` feature (see the
# workspace manifest); the binary links gpui's platform layer through it.
gpui_dock_picker = { workspace = true }
hxy-calculator = { workspace = true }
hxy-core = { workspace = true }
hxy-editor = { workspace = true, features = ["editor"] }
hxy-i18n = { workspace = true }
hxy-ipc = { workspace = true }
hxy-panels = { workspace = true }
hxy-plugin-host = { workspace = true }
hxy-settings = { workspace = true }
hxy-templates = { workspace = true }
hxy-vfs = { workspace = true }
hxy-view-gpui = { workspace = true }
# Only for `image::{Frame, RgbaImage}` in `gpui::RenderImage::new`'s
# signature (gpui does not re-export them); version range matches
# gpui 0.2.2's own `image = "0.25.1"` so the types unify.
image = { version = "0.25", default-features = false }
jiff = { workspace = true }
palette-core = { workspace = true }
# Decodes `file://` URL bytes handed to gpui's `on_open_urls` (macOS
# "Open With"). Already in the tree transitively, so this adds no build
# cost.
percent-encoding = "2"
# Embeds assets/icons; already in the dep tree via gpui_util, so this
# adds no new transitive deps.
rust-embed = "8"
serde_json = "1"
# Names the shared `SqlitePool` type held by `settings::PersistHandle`
# so the plugin layer can reuse the same pool + runtime hxy-settings
# opened. Version/features track hxy-settings so the pool types unify;
# already in the tree transitively, so this adds no build cost.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
thiserror = "2"
# Builds the runtime handed to hxy-settings' `SaveSink`, which blocks
# on it for its SQLite writes.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }

# Template panel "Save bytes to file..." dialog; matches the egui
# app's rfd version.
rfd = "0.17.2"

# Referenced for its `notify::Result` alias (`hxy_panels::watch::FileWatcher`'s
# constructors return it); pinned to the same version hxy-panels uses.
notify = "8"

# Reads the native macOS selection color (NSColor.selectedTextBackgroundColor)
# for the hex selection band. Both crates are already in the tree
# transitively via gpui, so this adds no new build cost; versions track
# gpui 0.2.2's objc2 stack so the types unify.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
zip = { version = "8.5.1", default-features = false }
