[package]
name = "hxy-bt-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Template-runtime plugin for 010 Editor .bt files."

[lib]
crate-type = ["cdylib"]

[dependencies]
hxy-plugin-api = { path = "../../crates/hxy-plugin-api" }
hxy-010-lang = { path = "../../crates/hxy-010-lang" }


# A member of the root workspace (buck2 builds it for wasm32-wasip2).
# Former standalone [workspace] and size [profile] removed; the size
# flags are applied by the buck2 wasm build.
